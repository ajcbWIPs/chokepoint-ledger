name: Network diagnostic (temporary)
on: workflow_dispatch
permissions:
  contents: write
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: |
          set +e
          {
          pip -q install openpyxl
          U=$(curl -sSL --max-time 20 -A "Mozilla/5.0" "https://www.worldbank.org/en/research/commodity-markets" | grep -o 'https://thedocs.worldbank.org[^"]*Monthly[^"]*xlsx' | head -1)
          echo "== $U"
          curl -sSL --max-time 60 -A "Mozilla/5.0" -o cmo.xlsx "$U"; ls -la cmo.xlsx
          python3 - <<'PY'
          import openpyxl
          wb = openpyxl.load_workbook("cmo.xlsx", read_only=True, data_only=True)
          print("sheets:", wb.sheetnames)
          ws = wb["Monthly Prices"]
          rows = list(ws.iter_rows(values_only=True))
          for i in range(0, 8):
              print(i, [str(c)[:22] for c in rows[i] if c is not None][:80])
          for r in rows[-3:]:
              print("last", [str(c)[:9] for c in r][:12])
          print("ncols", max(len(r) for r in rows), "nrows", len(rows))
          PY
          echo "== dns"; getent hosts query1.finance.yahoo.com fred.stlouisfed.org; echo "== env"; env | grep -i proxy
          echo "== python urllib"
          timeout 40 python3 -c "
          import urllib.request,time;t=time.time()
          r=urllib.request.urlopen(urllib.request.Request('https://query1.finance.yahoo.com/v8/finance/chart/BZ=F?range=5d&interval=1d',headers={'User-Agent':'Mozilla/5.0 (X11; Linux x86_64) Chrome/128'}),timeout=12)
          print(r.status, len(r.read()), round(time.time()-t,1),'s')" 2>&1 | tail -2
          } > diag.txt
          git config user.name diag-bot; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b diag-results; git add -f diag.txt; git commit -qm diag; git push -f origin diag-results
