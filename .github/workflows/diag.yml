name: Network diagnostic (temporary)
on: workflow_dispatch
permissions:
  contents: write
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: |
          set +e
          {
          B=https://api.db.nomics.world/v22
          for q in "brent%20spot" "wti%20spot" "ultra-low%20sulfur%20diesel%20new%20york%20harbor" "heating%20oil%20new%20york" ; do
            echo "== PET $q"
            curl -sS --max-time 20 "$B/series/EIA/PET?q=$q&limit=15" | jq -r '.series.docs[] | "\(.series_code) | \(.series_name)"' | head -15
          done
          echo "== NG henry hub"
          curl -sS --max-time 20 "$B/series/EIA/NG?q=henry%20hub&limit=10" | jq -r '.series.docs[] | "\(.series_code) | \(.series_name)"' | head -10
          for c in PCOPP PNICK PWHEAMT PMAIZMT PRICENPQ PSOYB PNGASJP PNGASEU POILBRE; do
            echo "== IMF $c"; curl -sS --max-time 20 "$B/series/IMF/PCPS/M.W00.$c.USD?observations=1" | jq -r '.series.docs[0] | "\(.series_name) | last \(.period[-1]) = \(.value[-1]) | n=\(.period|length)"'
          done
          echo "== sample daily brent obs"
          echo "== dns"; getent hosts query1.finance.yahoo.com fred.stlouisfed.org; echo "== env"; env | grep -i proxy
          echo "== python urllib"
          timeout 40 python3 -c "
          import urllib.request,time;t=time.time()
          r=urllib.request.urlopen(urllib.request.Request('https://query1.finance.yahoo.com/v8/finance/chart/BZ=F?range=5d&interval=1d',headers={'User-Agent':'Mozilla/5.0 (X11; Linux x86_64) Chrome/128'}),timeout=12)
          print(r.status, len(r.read()), round(time.time()-t,1),'s')" 2>&1 | tail -2
          } > diag.txt
          git config user.name diag-bot; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b diag-results; git add -f diag.txt; git commit -qm diag; git push -f origin diag-results
