name: diag
on: workflow_dispatch
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: |
          mkdir -p shots
          pip install -q rasterio requests numpy > /dev/null
          python - <<'PY' > shots/probe.txt 2>&1
          import requests, json, time, rasterio, traceback
          A="https://esoil.io/TERNLandscapes/RasterProductsAPI/"
          js=requests.get(A+"ProductInfo?format=json&attribute=",timeout=60).json()
          json.dump(js, open("shots/products.json","w"))
          cur=[p for p in js if str(p.get("isCurrentVersion"))=="1" and p.get("Component")=="Modelled-Value"]
          print(len(js), len(cur)); print(json.dumps(js[0]))
          for p in cur: print(p["Name"], "|", p.get("Attribute"), "|", {k:v for k,v in p.items() if "ath" in k or "URL" in k or "url" in k})
          ph=[p for p in cur if p["Name"].startswith("PHW_000_005")]
          for k,v in (ph[0] if ph else js[0]).items():
              if isinstance(v,str) and v.startswith("http"):
                  try:
                      with rasterio.open("/vsicurl/"+v) as d: print("RIO", v, d.profile, d.overviews(1), d.bounds)
                  except Exception as e: print("rio fail", v, e)
          try:
              r=requests.get("https://data.gov.au/data/api/3/action/package_show?id=d86b702b-73ad-4a7e-96ef-4e17fd0240cd",timeout=40).json()
              for res in r["result"]["resources"]: print("DSA", res.get("format"), res.get("url"))
          except Exception as e: print("dsa fail", e)
          r=requests.head("https://geodata.ucdavis.edu/climate/worldclim/2_1/base/wc2.1_2.5m_prec.zip",timeout=40,allow_redirects=True); print("WC", r.status_code, r.headers.get("content-length"))
          PY
          git config user.name diag-bot; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b diag-results; git add -f shots; git commit -qm probe; git push -f origin diag-results
