name: Network diagnostic (temporary)
on: workflow_dispatch
permissions:
  contents: write
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: |
          set +e
          {
          for u in "https://api.db.nomics.world/v22/series/IMF/PCPS/M.W00.PCOPP.USD?observations=1&format=json" \
                   "https://api.db.nomics.world/v22/series/EIA/PET?q=brent&limit=5" \
                   "https://api.db.nomics.world/v22/search?q=brent%20spot%20price&limit=5" ; do
            echo "== $u"
            curl -sS --max-time 20 -o body.txt -w "http %{http_code} time %{time_total}s\n" "$u" 2>&1 || echo "curl exit $?"
            head -c 600 body.txt; echo
          done
          echo "== fred http1.1"
          curl -sS --http1.1 -A "Mozilla/5.0 (X11; Linux x86_64) Chrome/128" --max-time 20 -o body.txt -w "http %{http_code} time %{time_total}s\n" "https://fred.stlouisfed.org/graph/fredgraph.csv?id=DCOILBRENTEU&cosd=2026-09-01" 2>&1 || echo "curl exit $?"
          head -c 200 body.txt; echo
          echo "== dns"; getent hosts query1.finance.yahoo.com fred.stlouisfed.org; echo "== env"; env | grep -i proxy
          echo "== python urllib"
          timeout 40 python3 -c "
          import urllib.request,time;t=time.time()
          r=urllib.request.urlopen(urllib.request.Request('https://query1.finance.yahoo.com/v8/finance/chart/BZ=F?range=5d&interval=1d',headers={'User-Agent':'Mozilla/5.0 (X11; Linux x86_64) Chrome/128'}),timeout=12)
          print(r.status, len(r.read()), round(time.time()-t,1),'s')" 2>&1 | tail -2
          } > diag.txt
          git config user.name diag-bot; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b diag-results; git add -f diag.txt; git commit -qm diag; git push -f origin diag-results
