name: Network diagnostic (temporary)
on: workflow_dispatch
permissions:
  contents: write
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - run: |
          set +e
          O="Origin: https://ajcbwips.github.io"
          chk() { echo "== $1"; curl -sS -L --max-time 25 -H "$O" -D hdr.txt -o body.bin -w "http %{http_code} %{content_type} %{size_download}B\n" "$1" 2>&1 || echo "curl fail"; grep -i "access-control-allow-origin" hdr.txt | head -1; }
          {
          chk "https://js.arcgis.com/4.34/"
          chk "https://js.arcgis.com/4.34/esri/themes/light/main.css"
          chk "https://services.arcgisonline.com/arcgis/rest/services/World_Imagery/MapServer?f=json"
          chk "https://services.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/3/3/3"
          chk "https://maps.isric.org/mapserv?map=/map/phh2o.map&SERVICE=WMS&REQUEST=GetCapabilities&VERSION=1.3.0"
          grep -o "<Name>[^<]*</Name>" body.bin | head -8
          grep -o 'EPSG:3857\|EPSG:4326' body.bin | sort | uniq -c
          chk "https://maps.isric.org/mapserv?map=/map/soc.map&SERVICE=WMS&REQUEST=GetCapabilities&VERSION=1.3.0"
          grep -o "<Name>[^<]*</Name>" body.bin | head -4
          chk "https://maps.isric.org/mapserv?map=/map/phh2o.map&SERVICE=WMS&VERSION=1.3.0&REQUEST=GetMap&LAYERS=phh2o_0-5cm_mean&STYLES=&CRS=EPSG:3857&BBOX=12000000,-4500000,14000000,-2500000&WIDTH=256&HEIGHT=256&FORMAT=image/png"
          chk "https://rest.isric.org/soilgrids/v2.0/properties/query?lon=117.5&lat=-31.5&property=phh2o&property=soc&property=clay&property=sand&property=nitrogen&depth=0-5cm&value=mean"
          head -c 700 body.bin; echo
          chk "https://archive-api.open-meteo.com/v1/archive?latitude=-31.5&longitude=117.5&start_date=2025-01-01&end_date=2025-12-31&daily=precipitation_sum,temperature_2m_mean&timezone=UTC"
          head -c 200 body.bin; echo
          chk "https://data.apps.fao.org/map/gsrv/gsrv1/glosis/wms?service=WMS&request=GetCapabilities"
          grep -io "<Name>[^<]*\(sal\|gsas\|sodic\)[^<]*</Name>" body.bin | head -20
          chk "https://data.apps.fao.org/map/gsrv/gsrv1/ows?service=WMS&request=GetCapabilities"
          grep -io "<Name>[^<]*\(sal\|gsas\|sodic\)[^<]*</Name>" body.bin | head -20
          chk "https://data.apps.fao.org/glosis/?lang=en"
          grep -o 'https\?://[^"'"'"' ]*\(wms\|gsrv\|geoserver\|ows\)[^"'"'"' ]*' body.bin | sort -u | head -15
          } > diag.txt 2>&1
          git config user.name diag-bot; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b diag-results; git add -f diag.txt; git commit -qm diag; git push -f origin diag-results
