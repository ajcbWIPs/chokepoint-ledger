name: diag
on: workflow_dispatch
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: |
          mkdir -p shots
          pip install -q rasterio requests numpy > /dev/null
          python - <<'PY' > shots/probe.txt 2>&1
          import requests, rasterio, time
          C=["https://esoil.io/TERNLandscapes/Public/Products/TERN/SLGA/30m/SOC/SOC_030_060_05_N_P_AU_TRN_N_20220727_30m.tif",
             "https://esoil.io/TERNLandscapes/Public/Products/TERN/SLGA/PHW/PHW_000_005_EV_N_P_AU_TRN_N_20220520.tif",
             "https://esoil.io/TERNLandscapes/Public/Products/TERN/SLGA/PHW/v1/PHW_000_005_EV_N_P_AU_TRN_N_20220520.tif",
             "https://esoil.io/TERNLandscapes/Public/Products/TERN/SLGA/CLY/CLY_000_005_EV_N_P_AU_TRN_N_20210902.tif",
             "https://files.isric.org/soilgrids/latest/data/phh2o/phh2o_0-5cm_mean.vrt"]
          for u in C:
              try:
                  t=time.time()
                  with rasterio.open("/vsicurl/"+u) as d:
                      print("OK", u, d.width, d.height, d.overviews(1), d.crs, f"{time.time()-t:.1f}s")
                      ov=d.overviews(1)
              except Exception as e: print("FAIL", u, e)
          for path in ["","SLGA/","SLGA/PHW/","SLGA/30m/"]:
              r=requests.get("https://esoil.io/TERNLandscapes/Public/Products/TERN/"+path,timeout=30); print("LIST",path,r.status_code,r.text[:1500].replace("\n"," "))
          r=requests.get("https://esoil.io/TERNLandscapes/RasterProductsAPI/Drill",params={"format":"json","verbose":"false","COGPath":"https://data.tern.org.au/model-derived/slga/NationalMaps/SoilAndLandscapeGrid/PHW/v1/PHW_000_005_EV_N_P_AU_TRN_N_20220520.tif","latitude":-31.6,"longitude":117.6},timeout=40); print("DRILL", r.status_code, r.text[:400])
          r=requests.get("https://data.gov.au/geoserver/australian-dryland-salinity-assessment-spatial-data-12500000-nlwra-2001/wfs?request=GetFeature&typeName=ckan_d86b702b_73ad_4a7e_96ef_4e17fd0240cd&outputFormat=json",timeout=120); print("DSA", r.status_code, len(r.content), r.text[:1200])
          PY
          git config user.name diag-bot; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b diag-results; git add -f shots; git commit -qm probe; git push -f origin diag-results
