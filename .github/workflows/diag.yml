name: diag
on: workflow_dispatch
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: |
          mkdir -p shots
          pip install -q requests openpyxl xlrd > /dev/null
          python - <<'PY' > shots/probe.txt 2>&1
          import requests, csv, io, collections
          ids="PURAN+PPROPANE+PGASO+PHEATOIL+PLITH+PCOBA+PREODOM+PLMMODY+PCHANA+POATS+PCOALAU+POILBRE"
          r=requests.get(f"https://api.imf.org/external/sdmx/2.1/data/IMF.RES,PCPS/G001.{ids}.USD.M?startPeriod=1960",timeout=120,headers={"Accept":"application/vnd.sdmx.data+csv;version=1.0.0","User-Agent":"Mozilla/5.0"})
          print(r.status_code, len(r.content))
          rows=list(csv.DictReader(io.StringIO(r.text)))
          by=collections.defaultdict(list); meta={}
          for x in rows:
              by[x["INDICATOR"]].append((x["TIME_PERIOD"],x["OBS_VALUE"])); meta[x["INDICATOR"]]=x
          for k,v in by.items():
              v.sort(); m=meta[k]
              print(k, len(v), v[0], v[-3:], "| SN:", m.get("SERIES_NAME","")[:160], "| UNIT?", {c:m[c] for c in ("SCALE","CURRENCY","PRICES","COMMODITY_CF") if m.get(c)})
              print("   DESC:", (m.get("FULL_DESCRIPTION") or "")[:300].replace("\n"," "))
          PY
          git config user.name diag-bot; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b diag-results; git add -f shots; git commit -qm probe; git push -f origin diag-results
