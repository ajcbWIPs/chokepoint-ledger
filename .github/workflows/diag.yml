name: Network diagnostic (temporary)
on: workflow_dispatch
permissions:
  contents: write
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: |
          set +e
          {
          B=https://api.db.nomics.world/v22
          for c in PET/RBRTE.D PET/RWTC.D PET/EER_EPD2DXL0_PF4_Y35NY_DPG.D NG/RNGWHHD.D; do
            echo "== EIA $c"; curl -sS --max-time 20 "$B/series/EIA/$c?observations=1" | jq -r '.series.docs[0] | "last \(.period[-1]) = \(.value[-1]) | n=\(.period|length)"'
          done
          echo "== WB datasets"
          curl -sS --max-time 20 "$B/search?q=commodity%20prices%20pink%20sheet&limit=8" | jq -r '.results.docs[] | "\(.provider_code)/\(.code) | \(.name) | indexed \(.indexed_at)"'
          curl -sS --max-time 20 "$B/datasets/WB?limit=60" | jq -r '.datasets.docs[] | "\(.code) | \(.name) | \(.converted_at)"' | grep -i -E "commod|pink|cmo" | head
          echo "== worldbank pink sheet page"
          curl -sSL --max-time 20 -A "Mozilla/5.0" "https://www.worldbank.org/en/research/commodity-markets" | grep -o 'https://thedocs.worldbank.org[^"]*Monthly[^"]*xlsx' | head -3
          echo "== dns"; getent hosts query1.finance.yahoo.com fred.stlouisfed.org; echo "== env"; env | grep -i proxy
          echo "== python urllib"
          timeout 40 python3 -c "
          import urllib.request,time;t=time.time()
          r=urllib.request.urlopen(urllib.request.Request('https://query1.finance.yahoo.com/v8/finance/chart/BZ=F?range=5d&interval=1d',headers={'User-Agent':'Mozilla/5.0 (X11; Linux x86_64) Chrome/128'}),timeout=12)
          print(r.status, len(r.read()), round(time.time()-t,1),'s')" 2>&1 | tail -2
          } > diag.txt
          git config user.name diag-bot; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b diag-results; git add -f diag.txt; git commit -qm diag; git push -f origin diag-results
