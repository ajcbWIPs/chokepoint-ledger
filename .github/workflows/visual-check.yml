name: Visual check of live pages
on: workflow_dispatch
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          pip install -q playwright && python -m playwright install --with-deps chromium > /dev/null
          mkdir -p shots
          cat > shot.py <<'PY'
          import asyncio
          from playwright.async_api import async_playwright
          BASE = "https://ajcbwips.github.io/chokepoint-ledger/"
          async def main():
              async with async_playwright() as p:
                  b = await p.chromium.launch()
                  log = []
                  for name, url, w, wait in [("atlas_wa", "land.html#z-wa-salt", 1400, 14000), ("atlas_sabah", "land.html#z-sabah", 1400, 14000), ("atlas_phone", "land.html#z-igp-sodic", 400, 14000)]:
                      pg = await b.new_page(viewport={"width": w, "height": 1000})
                      errs = []
                      pg.on("pageerror", lambda e: errs.append(str(e)))
                      pg.on("console", lambda m: errs.append(m.text) if m.type == "error" else None)
                      await pg.goto(BASE + url.replace("#", "?v=3#"), wait_until="domcontentloaded")
                      await pg.wait_for_timeout(wait)
                      ready = await pg.evaluate("!!window.atlasReady")
                      crops = await pg.eval_on_selector_all("#cropList .croprow b", "els=>els.map(e=>e.textContent)")
                      ro = await pg.inner_text("#readouts")
                      await pg.screenshot(path=f"shots/{name}.png", full_page=(w < 600))
                      log.append(f"{name}: ready={ready} crops={crops[:6]} readouts={ro.replace(chr(10),' | ')} errors={errs[:5]}")
                  pg = await b.new_page(viewport={"width": 1400, "height": 1000})
                  await pg.goto(BASE + "land.html?v=3"); await pg.wait_for_timeout(9000)
                  await pg.mouse.click(520, 600); await pg.wait_for_timeout(8000)
                  log.append("clicked: " + (await pg.inner_text("#spotName")) + " | " + (await pg.inner_text("#readouts")).replace("\n", " | ") + " | crops=" + str(await pg.eval_on_selector_all("#cropList .croprow b", "els=>els.slice(0,5).map(e=>e.textContent)")))
                  await pg.screenshot(path="shots/atlas_click.png")
                  open("shots/log.txt", "w").write("\n".join(log))
                  await b.close()
          asyncio.run(main())
          PY
          python shot.py
          git config user.name diag-bot; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b diag-results; git add -f shots; git commit -qm shots; git push -f origin diag-results
