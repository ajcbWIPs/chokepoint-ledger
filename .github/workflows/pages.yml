name: Refresh data feed and deploy to GitHub Pages
on:
  push:
    branches: [main]
  schedule:
    - cron: "17 21 * * *"   # daily at 08:17 Sydney (AEDT). Also keeps the repo active so the schedule never lapses
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Pull live prices (World Bank monthly, plus EIA daily if the EIA_API_KEY secret is set)
        run: |
          pip install -q openpyxl
          python -u scripts/update_feed.py
        env:
          EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
        timeout-minutes: 5
        continue-on-error: true
      - name: Save the feed to the repo (history and local dev)
        run: |
          git config user.name "feed-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          [ -f data/live.json ] || { echo "No feed yet"; exit 0; }
          git add data/live.json
          if git diff --cached --quiet; then echo "Feed unchanged"; else
            git commit -m "Update live price feed $(date -u +%Y-%m-%d)" && git push; fi
      - name: Stage site files only
        run: |
          mkdir _site
          cp -r index.html assets data _site/
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
