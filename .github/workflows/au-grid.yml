name: Build Australian soil grid
on:
  workflow_dispatch:
  schedule:
    - cron: "40 20 1 */3 *"
permissions:
  contents: write
  actions: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install GDAL and Python libs
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq gdal-bin > /dev/null
          pip install -q numpy requests rasterio geopandas shapely pyogrio
          gdalwarp --version
      - name: Build grid
        env:
          TERN_API_KEY: ${{ secrets.TERN_API_KEY }}
          GDAL_HTTP_MAX_RETRY: "5"
          GDAL_HTTP_RETRY_DELAY: "3"
          GDAL_CACHEMAX: "1024"
          VSI_CACHE: "TRUE"
        run: python scripts/build_au_grid.py
      - name: Commit grid
        run: |
          git config user.name "feed-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/au
          git diff --cached --quiet || git commit -m "Rebuild Australian soil grid $(date -u +%F)"
          git pull --rebase -q origin main && git push origin HEAD:main
      - name: Redeploy Pages
        run: gh workflow run pages.yml --ref main
        env:
          GH_TOKEN: ${{ github.token }}
